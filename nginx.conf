# www → apex (permanent)
server {
    listen 80;
    server_name www.driveopsfleet.com;
    return 301 https://driveopsfleet.com$request_uri;
}

server {
    listen 80 default_server;
    server_name ${NGINX_SERVER_NAME} _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Short SEO keyword URLs → primary pages (HTTP 301)
    # Tier 1
    location = /fleet-management-software { return 301 /fleet-management-software-india/; }
    location = /fleet-management-software/ { return 301 /fleet-management-software-india/; }
    location = /vehicle-management { return 301 /features/vehicle-management/; }
    location = /vehicle-management/ { return 301 /features/vehicle-management/; }
    location = /driver-management { return 301 /features/driver-management/; }
    location = /driver-management/ { return 301 /features/driver-management/; }
    location = /trip-management { return 301 /product/trips-dispatch/; }
    location = /trip-management/ { return 301 /product/trips-dispatch/; }
    # Tier 2 audience
    location = /taxi-management-software { return 301 /solutions/taxi-cab-fleets/; }
    location = /taxi-management-software/ { return 301 /solutions/taxi-cab-fleets/; }
    location = /taxi-management { return 301 /solutions/taxi-cab-fleets/; }
    location = /taxi-management/ { return 301 /solutions/taxi-cab-fleets/; }
    location = /cab-fleet-management { return 301 /solutions/taxi-cab-fleets/; }
    location = /cab-fleet-management/ { return 301 /solutions/taxi-cab-fleets/; }
    location = /corporate-fleet-management { return 301 /solutions/corporate-transport/; }
    location = /corporate-fleet-management/ { return 301 /solutions/corporate-transport/; }
    location = /corporate-transport-software { return 301 /solutions/corporate-transport/; }
    location = /corporate-transport-software/ { return 301 /solutions/corporate-transport/; }
    location = /goods-transport-software { return 301 /solutions/goods-transport/; }
    location = /goods-transport-software/ { return 301 /solutions/goods-transport/; }
    location = /truck-fleet-management { return 301 /solutions/goods-transport/; }
    location = /truck-fleet-management/ { return 301 /solutions/goods-transport/; }
    location = /tour-operator-software { return 301 /solutions/travel-tour-operators/; }
    location = /tour-operator-software/ { return 301 /solutions/travel-tour-operators/; }
    location = /self-drive-rental-software { return 301 /solutions/self-drive-rentals/; }
    location = /self-drive-rental-software/ { return 301 /solutions/self-drive-rentals/; }
    # Tier 3 product
    location = /compliance-management { return 301 /product/compliance/; }
    location = /compliance-management/ { return 301 /product/compliance/; }
    location = /fleet-compliance-software { return 301 /product/compliance/; }
    location = /fleet-compliance-software/ { return 301 /product/compliance/; }
    location = /vehicle-document-management { return 301 /product/compliance/; }
    location = /vehicle-document-management/ { return 301 /product/compliance/; }
    location = /vehicle-maintenance-software { return 301 /product/maintenance/; }
    location = /vehicle-maintenance-software/ { return 301 /product/maintenance/; }
    location = /fleet-maintenance-software { return 301 /product/maintenance/; }
    location = /fleet-maintenance-software/ { return 301 /product/maintenance/; }
    location = /driver-app { return 301 /product/driver-app/; }
    location = /driver-app/ { return 301 /product/driver-app/; }
    location = /fleet-driver-app { return 301 /product/driver-app/; }
    location = /fleet-driver-app/ { return 301 /product/driver-app/; }
    location = /live-fleet-tracking { return 301 /product/live-fleet/; }
    location = /live-fleet-tracking/ { return 301 /product/live-fleet/; }
    location = /gps-fleet-tracking { return 301 /product/live-fleet/; }
    location = /gps-fleet-tracking/ { return 301 /product/live-fleet/; }
    location = /fleet-fuel-management { return 301 /product/fuel/; }
    location = /fleet-fuel-management/ { return 301 /product/fuel/; }
    location = /fuel-log-software { return 301 /product/fuel/; }
    location = /fuel-log-software/ { return 301 /product/fuel/; }
    location = /fleet-review-management { return 301 /product/reviews/; }
    location = /fleet-review-management/ { return 301 /product/reviews/; }

    # Existing legacy aliases → HTTP 301
    location = /solutions/passenger-transport { return 301 /solutions/taxi-cab-fleets/; }
    location = /solutions/passenger-transport/ { return 301 /solutions/taxi-cab-fleets/; }
    location = /solutions/self-drive-rental { return 301 /solutions/self-drive-rentals/; }
    location = /solutions/self-drive-rental/ { return 301 /solutions/self-drive-rentals/; }
    location = /features/customer-review-collection { return 301 /features/whatsapp-review-management/; }
    location = /features/customer-review-collection/ { return 301 /features/whatsapp-review-management/; }
    location = /privacy { return 301 /privacy-policy/; }
    location = /privacy/ { return 301 /privacy-policy/; }
    location = /terms { return 301 /terms-and-conditions/; }
    location = /terms/ { return 301 /terms-and-conditions/; }

    # Prefer prerendered directory HTML; unknown routes use the real 404 page
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
